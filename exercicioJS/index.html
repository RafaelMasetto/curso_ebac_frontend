<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Números</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Comparador de Números</h1>
        <h2>Insira dois números, A e B. Para validar, B tem que ser maior que A.</h2>
        <form id="form-comparar">
            <input type="number" id="numA" required placeholder="Digite o Número A" />
            <input type="number" id="numB" required placeholder="Digite o Número B" />
            <button id="btn-validar" type="submit">Validar</button>
        </form>
        <p class="success-message"></p>
        <p class="error-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
